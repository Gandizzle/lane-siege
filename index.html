<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- Portrait, one-handed, fixed camera (DESIGN.md §4.1, §14.1).
         viewport-fit and user-scalable=no keep pinch-zoom from breaking the
         fixed-camera guarantee on mobile. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#11131a" />
    <title>Lane Siege</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #11131a;
        overflow: hidden;
        overscroll-behavior: none;
        -webkit-tap-highlight-color: transparent;
      }
      #game {
        position: fixed;
        inset: 0;
        touch-action: none;
      }
      canvas {
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
